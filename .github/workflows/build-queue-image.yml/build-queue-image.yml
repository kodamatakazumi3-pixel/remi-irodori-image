name: build-queue-image

on:
  push:
    paths:
      - "queue/**"
      - ".github/workflows/build-queue-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push queue image
        uses: docker/build-push-action@v6
        with:
          context: ./queue
          file: ./queue/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/irodori-tts-server:queue
          cache-from: type=gha,scope=queue
          cache-to: type=gha,mode=max,scope=queue
